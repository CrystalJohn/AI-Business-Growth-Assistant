services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-bizgrowth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-bizgrowth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-migrate:
    build:
      context: ./apps/api
    image: hr-chatbi-api:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-bizgrowth}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m scripts.seed_data"
    restart: "no"

  api:
    build:
      context: ./apps/api
    image: hr-chatbi-api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-bizgrowth}
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
    image: hr-chatbi-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  postgres_data:
